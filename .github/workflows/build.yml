name: Build Najma APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: najma-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK (preinstalled on runner)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Write app (index.html)
        run: |
          mkdir -p www
          gunzip -c najma-app.html.gz > www/index.html
          # repository that the in-app updater checks (GitHub Releases)
          sed -i "s#__NAJMA_REPO__#${{ github.repository }}#g" www/index.html
          grep -q "${{ github.repository }}" www/index.html || { echo "updater repo placeholder missing in najma-app.html.gz"; exit 1; }

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/app@6
          npx cap init "studNot" com.najma.notes --web-dir=www
          npx cap add android
          npm install pdfjs-dist@3.11.174 --omit=optional
          mkdir -p www/pdfjs
          cp node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js www/pdfjs/
          # --- OCR عربي محلي لأداة الحفظ (Tesseract.js + بيانات اللغة العربية) ---
          npm install tesseract.js@5 tesseract.js-core@5 @tesseract.js-data/ara --omit=optional
          mkdir -p www/tess/lang
          cp node_modules/tesseract.js/dist/tesseract.min.js node_modules/tesseract.js/dist/worker.min.js www/tess/
          cp node_modules/tesseract.js-core/tesseract-core*.wasm.js www/tess/
          ARA=$(ls node_modules/@tesseract.js-data/ara/4.0.0_best_int/ara.traineddata.gz node_modules/@tesseract.js-data/ara/4.0.0/ara.traineddata.gz 2>/dev/null | head -1)
          test -n "$ARA" && cp "$ARA" www/tess/lang/ara.traineddata.gz
          ls -la www/tess www/tess/lang
          npx cap sync android

      - name: Set studNot app icon
        run: |
          R=android/app/src/main/res
          tar -xzf "$GITHUB_WORKSPACE/najma-icons.tgz" -C "$R"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#FFFFFF</color>\n</resources>\n' > "$R/values/ic_launcher_background.xml"
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">studNot</string>#; s#<string name="title_activity_main">[^<]*</string>#<string name="title_activity_main">studNot</string>#' "$R/values/strings.xml"
          cat "$R/values/strings.xml"
          ls "$R"/mipmap-*

      - name: Add home-screen shortcut plugin
        run: |
          D=android/app/src/main/java/com/najma/notes
          mkdir -p "$D"
          cat > "$D/ShortcutPlugin.java" <<'JAVA_EOF'
          package com.najma.notes;

          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ShortcutInfo;
          import android.content.pm.ShortcutManager;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.drawable.Icon;
          import android.os.Build;
          import android.text.Layout;
          import android.text.StaticLayout;
          import android.text.TextPaint;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "Shortcut")
          public class ShortcutPlugin extends Plugin {
            @PluginMethod
            public void pin(PluginCall call) {
              String id = call.getString("id", "");
              String title = call.getString("title", "Note").trim();
              if (title.isEmpty()) title = "Note";
              int color;
              try { color = Color.parseColor(call.getString("color", "#3b5bdb")); } catch (Exception e) { color = Color.parseColor("#3b5bdb"); }
              if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) { call.reject("unsupported"); return; }
              Context c = getContext();
              ShortcutManager m = c.getSystemService(ShortcutManager.class);
              if (m == null || !m.isRequestPinShortcutSupported()) { call.reject("unsupported"); return; }
              Intent i = new Intent(c, MainActivity.class);
              i.setAction(Intent.ACTION_VIEW);
              i.putExtra("najmaNote", id);
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
              Bitmap b = Bitmap.createBitmap(192, 192, Bitmap.Config.ARGB_8888);
              Canvas cv = new Canvas(b);
              Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              p.setColor(color);
              cv.drawRoundRect(new RectF(0, 0, 192, 192), 44, 44, p);
              TextPaint tp = new TextPaint(Paint.ANTI_ALIAS_FLAG);
              tp.setColor(Color.WHITE);
              tp.setFakeBoldText(true);
              StaticLayout sl = null;
              for (float sz = 60; sz >= 16; sz -= 4) {
                tp.setTextSize(sz);
                sl = StaticLayout.Builder.obtain(title, 0, title.length(), tp, 160)
                  .setAlignment(Layout.Alignment.ALIGN_CENTER).build();
                if (sl.getHeight() <= 164) break;
              }
              cv.save();
              cv.translate(16, (192 - sl.getHeight()) / 2f);
              sl.draw(cv);
              cv.restore();
              Icon coverIcon = null;
              String iconB64 = call.getString("icon", null);
              if (iconB64 != null && !iconB64.isEmpty()) {
                try {
                  byte[] raw = android.util.Base64.decode(iconB64, android.util.Base64.DEFAULT);
                  Bitmap cb = android.graphics.BitmapFactory.decodeByteArray(raw, 0, raw.length);
                  if (cb != null) coverIcon = Icon.createWithAdaptiveBitmap(cb);
                } catch (Exception ex) { coverIcon = null; }
              }
              ShortcutInfo s = new ShortcutInfo.Builder(c, "note-" + id)
                .setShortLabel(title).setLongLabel(title)
                .setIcon(coverIcon != null ? coverIcon : Icon.createWithBitmap(b)).setIntent(i).build();
              m.requestPinShortcut(s, null);
              call.resolve();
            }

            @PluginMethod
            public void getLaunch(PluginCall call) {
              Intent i = getActivity().getIntent();
              JSObject r = new JSObject();
              String id = i == null ? null : i.getStringExtra("najmaNote");
              if (id != null) { r.put("id", id); i.removeExtra("najmaNote"); }
              call.resolve(r);
            }
          }
          JAVA_EOF
          cat > "$D/MainActivity.java" <<'JAVA_EOF'
          package com.najma.notes;

          import android.content.Intent;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(ShortcutPlugin.class);
              registerPlugin(FloatAppsPlugin.class);
              registerPlugin(StorageAccessPlugin.class);
              registerPlugin(UpdatePlugin.class);
              super.onCreate(savedInstanceState);
              fixKeyboard();
            }

            // Keeps the WebView above the soft keyboard even when adjustResize is ignored by the device/ROM.
            // Measures how much the keyboard overlaps the WebView and shrinks it by exactly that amount
            // (0 when the system already resized the window, so there is never a double shrink).
            private void fixKeyboard() {
              final android.view.View decor = getWindow().getDecorView();
              decor.getViewTreeObserver().addOnGlobalLayoutListener(new android.view.ViewTreeObserver.OnGlobalLayoutListener() {
                @Override
                public void onGlobalLayout() {
                  try {
                    android.webkit.WebView wv = getBridge().getWebView();
                    if (wv == null) return;
                    android.view.ViewGroup.LayoutParams p = wv.getLayoutParams();
                    if (!(p instanceof android.view.ViewGroup.MarginLayoutParams)) return;
                    android.view.ViewGroup.MarginLayoutParams lp = (android.view.ViewGroup.MarginLayoutParams) p;
                    androidx.core.view.WindowInsetsCompat wi = androidx.core.view.ViewCompat.getRootWindowInsets(decor);
                    int ime = 0;
                    if (wi != null && wi.isVisible(androidx.core.view.WindowInsetsCompat.Type.ime())) {
                      ime = wi.getInsets(androidx.core.view.WindowInsetsCompat.Type.ime()).bottom;
                    }
                    int[] loc = new int[2];
                    wv.getLocationInWindow(loc);
                    int slotBottom = loc[1] + wv.getHeight() + lp.bottomMargin;
                    int want = Math.max(0, slotBottom - (decor.getHeight() - ime));
                    if (want < 8) want = 0;
                    if (Math.abs(want - lp.bottomMargin) > 2) {
                      lp.bottomMargin = want;
                      wv.setLayoutParams(lp);
                    }
                  } catch (Throwable t) { }
                }
              });
            }

            @Override
            protected void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              setIntent(intent);
              String id = intent.getStringExtra("najmaNote");
              if (id != null) {
                intent.removeExtra("najmaNote");
                getBridge().triggerWindowJSEvent("najmaOpen", "{\"id\":\"" + id + "\"}");
              }
            }
          }
          JAVA_EOF

      - name: Add floating apps plugin (real device apps)
        run: |
          D=android/app/src/main/java/com/najma/notes
          mkdir -p "$D"
          cat > "$D/FloatAppsPlugin.java" <<'JAVA_EOF'
          package com.najma.notes;

          import android.app.ActivityOptions;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Rect;
          import android.graphics.drawable.Drawable;
          import android.provider.Settings;
          import android.util.Base64;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.ByteArrayOutputStream;
          import java.text.Collator;
          import java.util.*;

          @CapacitorPlugin(name = "FloatApps")
          public class FloatAppsPlugin extends Plugin {
            private static String iconOf(Drawable d) {
              int s = 112;
              Bitmap b = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888);
              Canvas cv = new Canvas(b);
              d.setBounds(0, 0, s, s);
              d.draw(cv);
              ByteArrayOutputStream o = new ByteArrayOutputStream();
              b.compress(Bitmap.CompressFormat.PNG, 100, o);
              return "data:image/png;base64," + Base64.encodeToString(o.toByteArray(), Base64.NO_WRAP);
            }

            @PluginMethod
            public void list(final PluginCall call) {
              new Thread(() -> {
                try {
                  Context c = getContext();
                  PackageManager pm = c.getPackageManager();
                  Intent q = new Intent(Intent.ACTION_MAIN);
                  q.addCategory(Intent.CATEGORY_LAUNCHER);
                  Set<String> seen = new HashSet<>();
                  List<JSObject> out = new ArrayList<>();
                  for (ResolveInfo r : pm.queryIntentActivities(q, 0)) {
                    String p = r.activityInfo.packageName;
                    if (p.equals(c.getPackageName()) || !seen.add(p)) continue;
                    JSObject o = new JSObject();
                    o.put("pkg", p);
                    o.put("name", String.valueOf(r.loadLabel(pm)));
                    try { o.put("icon", iconOf(r.loadIcon(pm))); } catch (Exception e) { }
                    out.add(o);
                  }
                  final Collator col = Collator.getInstance();
                  Collections.sort(out, (a, b) -> col.compare(a.optString("name"), b.optString("name")));
                  JSArray arr = new JSArray();
                  for (JSObject o : out) arr.put(o);
                  JSObject res = new JSObject();
                  res.put("apps", arr);
                  call.resolve(res);
                } catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
              }).start();
            }

            @PluginMethod
            public void launch(PluginCall call) {
              try {
                Context c = getContext();
                String pkg = call.getString("pkg", "");
                Intent i = c.getPackageManager().getLaunchIntentForPackage(pkg);
                if (i == null) { call.reject("not-found"); return; }
                float d = c.getResources().getDisplayMetrics().density;
                int x = (int) (call.getInt("x", 24) * d), y = (int) (call.getInt("y", 80) * d);
                int w = (int) (call.getInt("w", 300) * d), h = (int) (call.getInt("h", 420) * d);
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                boolean ff = c.getPackageManager().hasSystemFeature("android.software.freeform_window_management");
                try {
                  ff = ff || Settings.Global.getInt(c.getContentResolver(), "enable_freeform_support", 0) == 1
                    || Settings.Global.getInt(c.getContentResolver(), "force_resizable_activities", 0) == 1;
                } catch (Exception e) { }
                ActivityOptions opt = ActivityOptions.makeBasic();
                opt.setLaunchBounds(new Rect(x, y, x + w, y + h));
                getActivity().startActivity(i, opt.toBundle());
                JSObject r = new JSObject();
                r.put("floating", ff);
                call.resolve(r);
              } catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
            }
          }
          JAVA_EOF

      - name: Package visibility (list launchable apps)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q "<queries>" "$M" || sed -i 's#<application#<queries><intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent></queries>\n    <application#' "$M"
          grep -n "queries" "$M"

      - name: Soft keyboard resizes the screen (keeps the edited field visible)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if grep -q "windowSoftInputMode" "$M"; then
            sed -i -E 's#android:windowSoftInputMode="[^"]*"#android:windowSoftInputMode="adjustResize"#' "$M"
          else
            sed -i '0,/<activity/s#<activity#<activity android:windowSoftInputMode="adjustResize"#' "$M"
          fi
          grep -n "windowSoftInputMode" "$M" || { echo "windowSoftInputMode was not applied"; exit 1; }

      - name: Storage access plugin + permissions (save into main-storage folder "الدفاتر")
        run: |
          D=android/app/src/main/java/com/najma/notes
          mkdir -p "$D"
          cat > "$D/StorageAccessPlugin.java" <<'JAVA_EOF'
          package com.najma.notes;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.Settings;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "StorageAccess")
          public class StorageAccessPlugin extends Plugin {
            @PluginMethod
            public void has(PluginCall call) {
              JSObject r = new JSObject();
              boolean ok = Build.VERSION.SDK_INT < Build.VERSION_CODES.R || Environment.isExternalStorageManager();
              r.put("granted", ok);
              call.resolve(r);
            }

            @PluginMethod
            public void ask(PluginCall call) {
              if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) { call.resolve(); return; }
              try {
                Intent i = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                  Uri.parse("package:" + getContext().getPackageName()));
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                getActivity().startActivity(i);
                call.resolve();
              } catch (Exception e) {
                try {
                  Intent i = new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  getActivity().startActivity(i);
                  call.resolve();
                } catch (Exception e2) { call.reject(String.valueOf(e2.getMessage())); }
              }
            }
          }
          JAVA_EOF
          M=android/app/src/main/AndroidManifest.xml
          grep -q "WRITE_EXTERNAL_STORAGE" "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <application#' "$M"
          grep -q "MANAGE_EXTERNAL_STORAGE" "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <application#' "$M"
          grep -q "android.permission.VIBRATE" "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE" />\n    <application#' "$M"
          grep -q "requestLegacyExternalStorage" "$M" || sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' "$M"
          grep -n "uses-permission\|<application" "$M"

      - name: In-app updater plugin (download + install over the old version)
        run: |
          D=android/app/src/main/java/com/najma/notes
          mkdir -p "$D"
          cat > "$D/UpdatePlugin.java" <<'JAVA_EOF'
          package com.najma.notes;

          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          @CapacitorPlugin(name = "Updater")
          public class UpdatePlugin extends Plugin {
            private volatile boolean cancelled = false;

            private File dir() {
              File d = new File(getContext().getCacheDir(), "updates");
              if (!d.exists()) d.mkdirs();
              return d;
            }

            private static String safeName(String n) {
              n = n == null ? "update.apk" : n.replaceAll("[^A-Za-z0-9._-]", "_");
              if (!n.endsWith(".apk")) n += ".apk";
              return n;
            }

            private static HttpURLConnection connect(String url, int connectMs, int readMs) throws Exception {
              String u = url;
              for (int hop = 0; hop < 8; hop++) {
                HttpURLConnection c = (HttpURLConnection) new URL(u).openConnection();
                c.setInstanceFollowRedirects(false);
                c.setConnectTimeout(connectMs);
                c.setReadTimeout(readMs);
                c.setRequestProperty("User-Agent", "studNot-updater");
                c.setRequestProperty("Accept", "*/*");
                c.setRequestProperty("Accept-Encoding", "identity");
                int code = c.getResponseCode();
                if (code == 301 || code == 302 || code == 303 || code == 307 || code == 308) {
                  String loc = c.getHeaderField("Location");
                  c.disconnect();
                  if (loc == null) throw new Exception("redirect");
                  u = new URL(new URL(u), loc).toString();
                  continue;
                }
                return c;
              }
              throw new Exception("too-many-redirects");
            }

            @PluginMethod
            public void info(PluginCall call) {
              try {
                Context c = getContext();
                PackageInfo p = c.getPackageManager().getPackageInfo(c.getPackageName(), 0);
                long code = Build.VERSION.SDK_INT >= 28 ? p.getLongVersionCode() : p.versionCode;
                JSObject r = new JSObject();
                r.put("version", p.versionName);
                r.put("build", code);
                r.put("pkg", c.getPackageName());
                r.put("sdk", Build.VERSION.SDK_INT);
                r.put("canInstall", Build.VERSION.SDK_INT < Build.VERSION_CODES.O || c.getPackageManager().canRequestPackageInstalls());
                call.resolve(r);
              } catch (Exception e) {
                call.reject(String.valueOf(e.getMessage()));
              }
            }

            @PluginMethod
            public void allowInstall(PluginCall call) {
              try {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                  Intent i = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + getContext().getPackageName()));
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  getActivity().startActivity(i);
                }
                call.resolve();
              } catch (Exception e) {
                call.reject(String.valueOf(e.getMessage()));
              }
            }

            @PluginMethod
            public void download(final PluginCall call) {
              final String url = call.getString("url", "");
              final String name = safeName(call.getString("name", "update.apk"));
              if (url.isEmpty() || !url.startsWith("https://")) { call.reject("bad-url"); return; }
              cancelled = false;
              new Thread(() -> {
                File part = new File(dir(), name + ".part");
                File out = new File(dir(), name);
                HttpURLConnection c = null;
                try {
                  File[] old = dir().listFiles();
                  if (old != null) for (File f : old) if (!f.getName().equals(name) && !f.getName().equals(name + ".part")) f.delete();
                  c = connect(url, 20000, 30000);
                  if (c.getResponseCode() != 200) throw new Exception("HTTP " + c.getResponseCode());
                  long total = c.getContentLength();
                  InputStream in = c.getInputStream();
                  FileOutputStream fo = new FileOutputStream(part);
                  byte[] buf = new byte[65536];
                  long got = 0, lastTick = 0;
                  int lastPct = -2, n;
                  while ((n = in.read(buf)) > 0) {
                    if (cancelled) { fo.close(); in.close(); part.delete(); call.reject("cancelled"); return; }
                    fo.write(buf, 0, n);
                    got += n;
                    long now = System.currentTimeMillis();
                    int pct = total > 0 ? (int) (got * 100 / total) : -1;
                    if (now - lastTick > 150 && pct != lastPct) {
                      lastTick = now; lastPct = pct;
                      JSObject e = new JSObject();
                      e.put("percent", pct);
                      e.put("bytes", got);
                      e.put("total", total);
                      notifyListeners("progress", e);
                    }
                  }
                  fo.flush(); fo.close(); in.close();
                  if (got < 100000) throw new Exception("too-small");
                  if (total > 0 && got < total) throw new Exception("incomplete " + got + "/" + total);
                  if (out.exists()) out.delete();
                  if (!part.renameTo(out)) throw new Exception("rename");
                  JSObject r = new JSObject();
                  r.put("name", name);
                  r.put("size", got);
                  call.resolve(r);
                } catch (Exception e) {
                  part.delete();
                  call.reject(String.valueOf(e.getMessage()));
                } finally {
                  if (c != null) c.disconnect();
                }
              }).start();
            }

            @PluginMethod
            public void cancel(PluginCall call) {
              cancelled = true;
              call.resolve();
            }

            @PluginMethod
            public void install(PluginCall call) {
              try {
                Context c = getContext();
                File f = new File(dir(), safeName(call.getString("name", "")));
                if (!f.exists() || f.length() < 100000) { call.reject("missing"); return; }
                Uri u = FileProvider.getUriForFile(c, c.getPackageName() + ".najmaupdate", f);
                Intent i = new Intent(Intent.ACTION_VIEW);
                i.setDataAndType(u, "application/vnd.android.package-archive");
                i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                getActivity().startActivity(i);
                call.resolve();
              } catch (Exception e) {
                call.reject(String.valueOf(e.getMessage()));
              }
            }

            @PluginMethod
            public void cleanup(PluginCall call) {
              try {
                File[] fs = dir().listFiles();
                if (fs != null) for (File f : fs) f.delete();
              } catch (Exception e) { }
              call.resolve();
            }

            @PluginMethod
            public void httpGet(final PluginCall call) {
              final String url = call.getString("url", "");
              if (!url.startsWith("https://")) { call.reject("bad-url"); return; }
              new Thread(() -> {
                HttpURLConnection c = null;
                try {
                  c = connect(url, 15000, 20000);
                  int code = c.getResponseCode();
                  InputStream in = code >= 400 ? c.getErrorStream() : c.getInputStream();
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  if (in != null) {
                    byte[] buf = new byte[8192];
                    int n;
                    while ((n = in.read(buf)) > 0 && bo.size() < 2000000) bo.write(buf, 0, n);
                    in.close();
                  }
                  JSObject r = new JSObject();
                  r.put("status", code);
                  r.put("text", bo.toString("UTF-8"));
                  call.resolve(r);
                } catch (Exception e) {
                  call.reject(String.valueOf(e.getMessage()));
                } finally {
                  if (c != null) c.disconnect();
                }
              }).start();
            }
          }
          JAVA_EOF
          cat > "$D/NajmaFileProvider.java" <<'JAVA_EOF'
          package com.najma.notes;

          public class NajmaFileProvider extends androidx.core.content.FileProvider {}
          JAVA_EOF
          R=android/app/src/main/res
          mkdir -p "$R/xml"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<paths>\n    <cache-path name="najma_updates" path="updates/" />\n</paths>\n' > "$R/xml/najma_update_paths.xml"
          M=android/app/src/main/AndroidManifest.xml
          grep -q "REQUEST_INSTALL_PACKAGES" "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application#' "$M"
          grep -q "najmaupdate" "$M" || sed -i 's#</application>#    <provider android:name="com.najma.notes.NajmaFileProvider" android:authorities="${applicationId}.najmaupdate" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/najma_update_paths" /></provider>\n    </application>#' "$M"
          grep -n "REQUEST_INSTALL_PACKAGES\|najmaupdate" "$M"

      - name: Fixed signing key and version (so new APK updates the installed one)
        env:
          KS_SECRET: ${{ secrets.NAJMA_KEYSTORE_B64 }}
        run: |
          # IMPORTANT: never change this key. Android only installs an update if it is
          # signed with the SAME key as the installed app and has a HIGHER versionCode.
          mkdir -p ~/.android
          if [ -n "$KS_SECRET" ]; then
            echo "$KS_SECRET" | base64 -d > ~/.android/debug.keystore
            echo "Keystore source: repository secret NAJMA_KEYSTORE_B64"
          else
            echo "" | base64 -d > ~/.android/debug.keystore
            echo "Keystore source: embedded key"
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "Alias name|SHA256" || true
          # versionCode = minutes since epoch -> always increases, even if run numbers reset
          VC=$(( $(date -u +%s) / 60 ))
          VN="1.${{ github.run_number }}"
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $VC/" "$G"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$VN\"/" "$G"
          grep -nE "versionCode|versionName" "$G"
          echo "VC=$VC" >> "$GITHUB_ENV"
          echo "VN=$VN" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Print APK signing fingerprint (must be identical in every build)
        run: |
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          OUT=$("$AS" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk || true)
          echo "$OUT"
          {
            echo "### Najma build $VN (versionCode $VC)"
            echo '```'
            echo "$OUT" | grep -E "SHA-256|SHA-1" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare release files
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/studNot-v${{ github.run_number }}.apk"
          {
            echo "<!-- versionCode:$VC versionName:$VN -->"
            git log -1 --pretty=%B | head -c 1500
          } > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: najma-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Najma v${{ github.run_number }}
          body_path: dist/RELEASE_NOTES.md
          make_latest: true
          files: dist/studNot-v${{ github.run_number }}.apk
